steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/flash-audio-457504-f2/video-summary-backend', '.']

  # Step 2: Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/flash-audio-457504-f2/video-summary-backend']

  # Step 3: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - video-summary-backend
      - --image=gcr.io/flash-audio-457504-f2/video-summary-backend
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --set-env-vars=OPENAI_API_KEY=sk-..  # Replace or use Secret Manager

timeout: '1200s'
